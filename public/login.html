<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSS - Portal Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
        .admin-wrapper {
            min-height: 100vh;
            padding: 80px 0;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-card {
            background: var(--bg-surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: transform var(--anim-normal), box-shadow var(--anim-normal);
        }

        .login-card {
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        /* Sliding Pill Tab Switcher */
        .login-toggle-container {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 25px;
        }
        
        .lightmode .login-toggle-container {
            background: rgba(0, 0, 0, 0.03);
        }

        .login-toggle-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-secondary) !important;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 25px;
            transition: all var(--anim-normal);
            cursor: pointer;
        }

        .login-toggle-btn.active {
            background: var(--accent-gradient);
            color: #ffffff !important;
            box-shadow: var(--glow-btn-shadow);
        }

        .password-toggle-btn {
            background: transparent !important;
            border: none !important;
            color: var(--text-secondary) !important;
            cursor: pointer;
            transition: color var(--anim-fast);
        }
        
        .password-toggle-btn:hover {
            color: var(--accent-color) !important;
        }

        .form-control-dss {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-white) !important;
            padding: 12px 16px;
            border-radius: 10px;
            transition: all var(--anim-normal);
        }
        
        .lightmode .form-control-dss {
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-primary) !important;
        }

        .btn-dss {
            background: var(--accent-gradient);
            color: #ffffff !important;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            transition: transform var(--anim-fast), box-shadow var(--anim-fast);
            box-shadow: var(--glow-btn-shadow);
        }

        .btn-dss:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(250, 157, 28, 0.5);
        }

        .btn-dss:active {
            transform: translateY(1px);
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-surface-glass);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--card-shadow);
            z-index: 9999;
            transform: translateY(150px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-notification.success i {
            color: var(--success-color);
        }

        .toast-notification.error i {
            color: var(--error-color);
        }

        /* Mobile Responsiveness Rules */
        @media (max-width: 575.98px) {
            .admin-wrapper {
                padding: 40px 15px;
            }
            .login-card {
                padding: 24px 20px !important;
                border-radius: 16px;
            }
            .toast-notification {
                left: 20px;
                right: 20px;
                bottom: 20px;
                justify-content: center;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body style="background-color: var(--bg-dark); color: var(--text-secondary); transition: background-color var(--anim-normal);">

    <!-- Background glow elements -->
    <div id="cursor-glow"></div>

    <!-- Theme Switcher floating button -->
    <div style="position: absolute; top: 20px; right: 20px; z-index: 10;">
        <button id="themeSwitch" class="btn btn-outline-secondary rounded-circle" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-primary);">
            <i id="themeIcon" class="fas fa-moon"></i>
        </button>
    </div>

    <!-- LOGIN CONTAINER -->
    <div class="admin-wrapper w-100" id="loginWrapper">
        <div class="container d-flex justify-content-center">
            <div id="loginPanel" class="login-card admin-card p-4">
                <div class="text-center mb-4">
                    <img src="./image/logo-light.png" alt="DSS Logo" id="logoImg" class="mb-3" style="height: 65px !important; width: auto; object-fit: contain;">
                    <h2 class="text-white fw-bold" id="loginPortalTitle">Admin Portal</h2>
                    <p class="text-muted mb-4" id="loginPortalSubtitle">Enter credentials to manage works</p>
                </div>

                <!-- Unified Role Switcher Tab -->
                <div class="login-toggle-container">
                    <button type="button" class="login-toggle-btn active" id="loginTabAdmin">Admin Portal</button>
                    <button type="button" class="login-toggle-btn" id="loginTabStaff">Staff Portal</button>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="usernameOrEmail" class="form-label text-white-50" id="loginUsernameLabel">Username</label>
                        <input type="text" class="form-control form-control-dss" id="usernameOrEmail" placeholder="e.g. admin" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-white-50">Password</label>
                        <div class="position-relative">
                            <input type="password" class="form-control form-control-dss pe-5" id="password" placeholder="Enter password" required autocomplete="new-password">
                            <button type="button" id="togglePasswordBtn" class="password-toggle-btn position-absolute end-0 top-50 translate-middle-y border-0 p-0 me-3" style="box-shadow: none; z-index: 10;">
                                <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="text-end mb-4">
                        <a href="#" id="forgotPasswordBtn" class="text-decoration-none" style="font-size: 13px; color: var(--accent-color); font-weight: 500; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-dss w-100" id="loginBtn">
                        <span>Sign In</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-notification">
        <i id="toastIcon" class="fa-solid"></i>
        <div id="toastMessage" style="font-weight: 500; font-size: 14px;"></div>
    </div>

    <script>
        // Cursor Glow
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            if (glow) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            }
        });

        // Toast Helper
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMessage');
            if (!toast) return;
            toast.className = `toast-notification show ${isSuccess ? 'success' : 'error'}`;
            toastIcon.className = `fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}`;
            toastMsg.textContent = message;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Theme Switcher
        const themeSwitch = document.getElementById('themeSwitch');
        const themeIcon = document.getElementById('themeIcon');
        
        const updateLogos = (isLight) => {
            const logoImg = document.getElementById('logoImg');
            const logoPath = isLight ? './image/logo-dark.png' : './image/logo-light.png';
            if (logoImg) logoImg.src = logoPath;
        };

        const setTheme = (isLight) => {
            if (isLight) {
                document.documentElement.classList.add('lightmode');
                if (themeIcon) themeIcon.className = 'fas fa-sun';
                localStorage.setItem('lightmode', 'active');
            } else {
                document.documentElement.classList.remove('lightmode');
                if (themeIcon) themeIcon.className = 'fas fa-moon';
                localStorage.removeItem('lightmode');
            }
            updateLogos(isLight);
        };

        const isLightModeActive = localStorage.getItem('lightmode') === 'active';
        setTheme(isLightModeActive);

        if (themeSwitch) {
            themeSwitch.addEventListener('click', () => {
                const currentMode = document.documentElement.classList.contains('lightmode');
                setTheme(!currentMode);
            });
        }

        // Role Tab Switcher
        const tabAdmin = document.getElementById('loginTabAdmin');
        const tabStaff = document.getElementById('loginTabStaff');
        const portalTitle = document.getElementById('loginPortalTitle');
        const portalSubtitle = document.getElementById('loginPortalSubtitle');
        const usernameLabel = document.getElementById('loginUsernameLabel');
        const usernameInput = document.getElementById('usernameOrEmail');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');
        const loginBtn = document.getElementById('loginBtn');

        let activeRole = 'admin';

        // Check query parameters to default role
        const urlParams = new URLSearchParams(window.location.search);
        const defaultRole = urlParams.get('role');
        if (defaultRole === 'staff') {
            updateRoleUI('staff');
        } else {
            updateRoleUI('admin');
        }

        function updateRoleUI(role) {
            activeRole = role;
            if (role === 'admin') {
                tabAdmin.classList.add('active');
                tabStaff.classList.remove('active');
                portalTitle.textContent = 'Admin Portal';
                portalSubtitle.textContent = 'Enter credentials to manage works';
                usernameLabel.textContent = 'Username';
                usernameInput.type = 'text';
                usernameInput.placeholder = 'e.g. admin';
                usernameInput.value = '';
            } else {
                tabStaff.classList.add('active');
                tabAdmin.classList.remove('active');
                portalTitle.textContent = 'Staff Portal';
                portalSubtitle.textContent = 'Enter credentials to log attendance & tasks';
                usernameLabel.textContent = 'Email Address';
                usernameInput.type = 'email';
                usernameInput.placeholder = 'e.g. staff@dss.com';
                usernameInput.value = '';
            }
        }

        if (tabAdmin) tabAdmin.addEventListener('click', () => updateRoleUI('admin'));
        if (tabStaff) tabStaff.addEventListener('click', () => updateRoleUI('staff'));

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                if (togglePasswordIcon) {
                    togglePasswordIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
                }
            });
        }

        // Handle Login Submit
        const form = document.getElementById('loginForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const usernameOrEmail = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span><i class="fas fa-spinner fa-spin me-2"></i> Signing In...</span>';

                try {
                    if (activeRole === 'admin') {
                        const response = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: usernameOrEmail, password })
                        });
                        const data = await response.json();

                        if (response.ok && data.success) {
                            localStorage.setItem('adminToken', data.token);
                            document.cookie = `adminToken=${data.token}; path=/; max-age=86400; SameSite=Strict`;
                            showToast('Login successful! Redirecting...', true);
                            setTimeout(() => {
                                window.location.href = '/admin';
                            }, 1000);
                        } else {
                            showToast(data.message || 'Invalid username or password!', false);
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = '<span>Sign In</span>';
                        }
                    } else {
                        const response = await fetch('/api/staff/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: usernameOrEmail, password })
                        });
                        const data = await response.json();

                        if (response.ok && data.success) {
                            localStorage.setItem('staffToken', data.token);
                            localStorage.setItem('staffInfo', JSON.stringify(data.staff));
                            document.cookie = `staffToken=${data.token}; path=/; max-age=86400; SameSite=Strict`;
                            showToast('Login successful! Redirecting...', true);
                            setTimeout(() => {
                                window.location.href = '/staff';
                            }, 1000);
                        } else {
                            showToast(data.message || 'Invalid email or password!', false);
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = '<span>Sign In</span>';
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('Connection to server failed. Please try again.', false);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>Sign In</span>';
                }
            });
        }

        // Forgot Password Handler
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        if (forgotPasswordBtn) {
            forgotPasswordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (activeRole === 'admin') {
                    showResetModal(
                        'Admin Password Reset',
                        'Admin credentials are managed via environment variables. To change the password, please update the <code style="color: var(--accent-color);">ADMIN_PASS</code> variable in your Railway dashboard settings or local <code style="color: var(--accent-color);">.env</code> file.'
                    );
                } else {
                    showResetModal(
                        'Staff Password Reset',
                        'Please contact the Administrator at <strong style="color: var(--text-primary);">Design Shaper Studio</strong> to reset or recover your staff login password.'
                    );
                }
            });
        }

        function showResetModal(title, message) {
            const existing = document.getElementById('reset-info-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'reset-info-modal';
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100%';
            modal.style.height = '100%';
            modal.style.backgroundColor = 'rgba(10, 10, 12, 0.85)';
            modal.style.backdropFilter = 'blur(10px)';
            modal.style.zIndex = '99999';
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
            modal.style.opacity = '0';
            modal.style.transition = 'opacity 0.3s ease';

            modal.innerHTML = `
                <div class="glass-card" style="max-width: 400px; width: 90%; text-align: center; padding: 30px; position: relative;">
                    <button class="modal-close-btn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">&times;</button>
                    <div style="font-size: 40px; color: var(--accent-color); margin-bottom: 15px;">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <h3 class="text-white mb-3" style="font-size: 20px; font-weight: 700;">${title}</h3>
                    <p class="text-white-50" style="font-size: 14px; line-height: 1.6; margin-bottom: 20px;">${message}</p>
                    <button class="btn btn-dss w-100 modal-ok-btn">OK</button>
                </div>
            `;

            document.body.appendChild(modal);

            setTimeout(() => {
                modal.style.opacity = '1';
            }, 10);

            const closeModal = () => {
                modal.style.opacity = '0';
                setTimeout(() => modal.remove(), 300);
            };

            modal.querySelector('.modal-close-btn').addEventListener('click', closeModal);
            modal.querySelector('.modal-ok-btn').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }
    </script>
</body>
</html>
